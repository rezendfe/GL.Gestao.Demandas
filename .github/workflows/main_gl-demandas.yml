# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - gl-demandas

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: dotnet publish
        run: dotnet publish backend/src/Gl.Demandas.Api/Gl.Demandas.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_53C92FB683CD46F089BB1326B88A240A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_137A4D817B404DAFB80A89ADD77E4702 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1CB71A9B4FC742ED9AD25A222DF03D4B }}

      - name: Configure App Service
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          app=gl-demandas
          rg=$(az webapp list --query "[?name=='$app'].resourceGroup | [0]" -o tsv)
          if [ -z "$rg" ]; then
            echo "App Service $app não encontrado na assinatura ligada ao GitHub."
            exit 1
          fi
          kind=$(az webapp show -g "$rg" -n "$app" --query kind -o tsv)
          host="gray-bay-0ad3ef71e.1.azurestaticapps.net"
          echo "resource_group=$rg"
          echo "kind=$kind"
          echo "portal_host=$host"
          key=$(az webapp config appsettings list -g "$rg" -n "$app" --query "[?name=='Auth__SigningKey'].value | [0]" -o tsv)
          if [ -z "$key" ]; then
            key=$(openssl rand -base64 48 | tr -d '\n')
            echo "::add-mask::$key"
          fi
          if [[ "$kind" == *linux* ]]; then
            pasta="/home/data/anexos"
            az webapp config set -g "$rg" -n "$app" --linux-fx-version "DOTNETCORE|10.0" -o none
          else
            pasta='D:\home\data\anexos'
          fi
          if [ -z "${SQL_CONNECTION_STRING:-}" ]; then
            echo "Defina o segredo SQL_CONNECTION_STRING do repositório."
            exit 1
          fi
          az webapp config appsettings set -g "$rg" -n "$app" -o none --settings \
            ASPNETCORE_ENVIRONMENT=Production \
            Auth__Mode=Demo \
            Auth__SigningKey="$key" \
            Database__Provider=SqlServer \
            ConnectionStrings__Sql="$SQL_CONNECTION_STRING" \
            Anexo__Provider=Local \
            Anexo__Pasta="$pasta" \
            Cors__Origins__0="https://$host" \
            Cors__Origins__1="http://localhost:5173" \
            Cors__Origins__2="http://127.0.0.1:5173"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "gl-demandas"
          slot-name: "Production"
          package: api

      - name: Checkout SQL scripts
        uses: actions/checkout@v4

      - name: Apply SQL schema
        env:
          SQLCMDPASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SQLCMDPASSWORD:-}" ]; then
            echo "Defina o segredo SQL_PASSWORD do repositório."
            exit 1
          fi
          ip=$(curl -fsSL https://api.ipify.org)
          rg=$(az webapp list --query "[?name=='gl-demandas'].resourceGroup | [0]" -o tsv)
          if [ -z "$rg" ]; then
            echo "App Service gl-demandas não encontrado na assinatura."
            exit 1
          fi
          rule="gha-${{ github.run_id }}"
          cleanup() {
            az sql server firewall-rule delete \
              --resource-group "$rg" \
              --server smartezy \
              --name "$rule" || true
          }
          trap cleanup EXIT
          az sql server firewall-rule create \
            --resource-group "$rg" \
            --server smartezy \
            --name "$rule" \
            --start-ip-address "$ip" \
            --end-ip-address "$ip" \
            -o none
          az sql server firewall-rule create \
            --resource-group "$rg" \
            --server smartezy \
            --name AllowAzureServices \
            --start-ip-address 0.0.0.0 \
            --end-ip-address 0.0.0.0 \
            -o none || true
          curl -fsSL -o /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          for script in 01_schema.sql 02_tables.sql 11_seed.sql 12_espacos_locacoes.sql 13_alinhamento_modelo.sql 14_conteudo_demonstracao.sql; do
            /opt/mssql-tools18/bin/sqlcmd \
              -S smartezy.database.windows.net \
              -d gl-demandas \
              -U usr.smartezy \
              -I -C -b \
              -i "$PWD/infra/database/sql-server/$script"
          done
