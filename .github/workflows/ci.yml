name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore backend/Gl.Demandas.slnx
      - name: Test
        run: dotnet test backend/Gl.Demandas.slnx --configuration Release --no-restore
      - name: Publish API
        run: dotnet publish backend/src/Gl.Demandas.Api/Gl.Demandas.Api.csproj --configuration Release --output artifacts/api
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: artifacts/api
          if-no-files-found: error

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: portal
          path: web/dist
          if-no-files-found: error
